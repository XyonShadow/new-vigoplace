name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Deploy
    runs-on: production
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v2
    - name: Executing remote command
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    # - name: Add .env
    - run: echo "${{secrets.ENV}}" > .env
    - run: npm install
    - run: npm run build
    - run: npm run start:prod